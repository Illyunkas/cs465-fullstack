<section class="login-panel">
  <h1>Admin sign in</h1>
  <form (ngSubmit)="submit()" #loginForm="ngForm" novalidate>
    <div class="mb-3">
      <label class="form-label" for="email">Email address</label>
      <input id="email" class="form-control" type="email" name="email" [(ngModel)]="email" required autocomplete="email">
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input id="password" class="form-control" type="password" name="password" [(ngModel)]="password" required autocomplete="current-password">
    </div>
    <p *ngIf="formError" class="text-danger" role="alert">{{ formError }}</p>
    <button class="btn btn-primary" type="submit" [disabled]="isSubmitting">Sign In</button>
  </form>
</section>
